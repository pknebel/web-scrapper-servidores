spring.application.name=web-scrapper-servidores

# Porta. Plataformas de nuvem (Render, Cloud Run, Koyeb) injetam a variavel PORT.
# Localmente continua em 8080.
server.port=${PORT:8080}

# Fuso horario usado para determinar o ano e o mes corrente na consulta anual.
app.timezone=America/Sao_Paulo

# Origem permitida para o frontend (CORS).
# Em producao, defina APP_CORS_ORIGEM com a URL publicada do front
# (ex.: https://web-scrapper-front.vercel.app). Sem a variavel, vale o localhost do Vite.
app.cors.origem=${APP_CORS_ORIGEM:http://localhost:5173}

# Servico externo (portal da transparencia).
app.api-externa.base-url=https://transparencia.e-publica.net/epublica-portal/rest/chapeco/gestaoDePessoal
# O parametro "exercicio" e preso ao ano. Cadastre um exercicio por ano conforme
# forem sendo conhecidos; o exercicio-padrao e usado como fallback.
app.api-externa.exercicio-padrao=158
app.api-externa.exercicio-por-ano.2026=158
# Numero total de tentativas por requisicao (1 = sem retentativa).
app.api-externa.tentativas=2
app.api-externa.intervalo-retentativa-ms=500
app.api-externa.timeout-conexao-ms=10000
app.api-externa.timeout-leitura-ms=30000

# Consulta anual.
# Validade do resultado consolidado. Evita refazer ~120 requisicoes quando o usuario
# consulta a tabela e em seguida baixa a planilha. 0 desativa o cache.
app.consulta-anual.cache-ttl-minutos=10
# false: registra a falha do mes e segue para os demais (padrao).
# true: interrompe o processamento no primeiro mes que falhar.
app.consulta-anual.falhar-se-algum-mes-falhar=false
